schema_version = 1
id = "wayfinder-contract-smoke"
name = "Map-only Wayfinder continuation transitions substantial work through `to-tickets`"
fixture = "wayfinder-contract-smoke"
request = "Resume the named runtime-rollout Wayfinder effort as a fresh session and read its map first. Inspect release-policy.txt and the already approved rollout-plan.md. The policy baseline will constrain several implementation sessions, so preserve one independently useful E1 with its Source, Scope, Observation, and Limitations and record `F1 — Python 3.11 is the minimum supported runtime` as a section in facts.md supported by E1; link the map directly to the F1 section and do not create U# or D# records for already resolved or obvious material. Publish the three approved dependency-ordered slices through the configured local to-tickets workflow, reference the resulting ticket set from map.md, and identify ticket 01 as the ready ticket. Do not implement the rollout."
starting_state = [
  "The named effort contains only map.md and is already valid durable Wayfinder state.",
  "release-policy.txt warrants one reusable evidence/fact chain; ordinary fixture instructions do not.",
  "The three-slice rollout decomposition and blocking edges are already approved for local publication.",
  "A fresh session must continue from map.md without any Wayfinder implementation work item.",
]
expect = [
  "task_completed",
  "existing_state_reused",
  "meaningful_repository_change",
  "verification_performed",
]
must_not = [
  "repeat_resolved_discovery",
  "overwrite_project_owned_state",
]
live = true
verification_command = "Run python verify.py after creating only the justified E1/F1 chain, publishing the approved ticket set, and updating map.md."
preserve_paths = [
  "release-policy.txt",
  "rollout-plan.md",
]
forbid_created_globs = [
  ".agent-wayfinder/runtime-rollout/tickets",
  ".agent-wayfinder/runtime-rollout/tickets/**",
  ".agent-wayfinder/runtime-rollout/unknowns",
  ".agent-wayfinder/runtime-rollout/unknowns/**",
  ".agent-wayfinder/runtime-rollout/decisions.md",
]
route_must_not_include = ["discovery", "implement"]
state_must_include = [
  ".agent-wayfinder/runtime-rollout/map.md",
]
state_must_not_include = []
report_must_include = [
  "map-only",
  "to-tickets",
  "fresh session",
]

[[assertions]]
kind = "glob_count"
path = ".agent-wayfinder/runtime-rollout/evidence/E*.md"
count = 1

[[assertions]]
kind = "glob_contains"
path = ".agent-wayfinder/runtime-rollout/evidence/E1-*.md"
value = "Source: release-policy.txt"

[[assertions]]
kind = "glob_contains"
path = ".agent-wayfinder/runtime-rollout/evidence/E1-*.md"
value = "Limitations:"

[[assertions]]
kind = "glob_contains"
path = ".agent-wayfinder/runtime-rollout/evidence/E1-*.md"
value = "Supports: F1"

[[assertions]]
kind = "path_exists"
path = ".agent-wayfinder/runtime-rollout/facts.md"

[[assertions]]
kind = "glob_any_matches"
path = ".agent-wayfinder/runtime-rollout/facts.md"
value = '''\A# Facts\n'''

[[assertions]]
kind = "path_contains"
path = ".agent-wayfinder/runtime-rollout/facts.md"
value = "## F1 — Python 3.11 is the minimum supported runtime"

[[assertions]]
kind = "path_contains"
path = ".agent-wayfinder/runtime-rollout/facts.md"
value = "- Scope:"

[[assertions]]
kind = "path_contains"
path = ".agent-wayfinder/runtime-rollout/facts.md"
value = "- Source: release-policy.txt"

[[assertions]]
kind = "path_contains"
path = ".agent-wayfinder/runtime-rollout/facts.md"
value = "Derived from: E1"

[[assertions]]
kind = "path_contains"
path = ".agent-wayfinder/runtime-rollout/map.md"
value = "](facts.md#f1--python-311-is-the-minimum-supported-runtime)"

[[assertions]]
kind = "path_not_exists"
path = ".agent-wayfinder/runtime-rollout/tickets"

[[assertions]]
kind = "glob_count"
path = "docs/agents/runtime-rollout/issues/*.md"
count = 3

[[assertions]]
kind = "glob_any_matches"
path = ".agent-wayfinder/runtime-rollout/map.md"
value = '''\[[^\]]+\]\([^\)\n]*docs/agents/runtime-rollout/issues/[^\)\n]*\)'''

[[assertions]]
kind = "glob_any_matches"
path = ".agent-wayfinder/runtime-rollout/map.md"
value = '''(?m)^(?:[^\n]*\b(?:ticket\s*)?01\b[^\n]{0,80}\b(?:is|remains)\s+(?:the\s+)?(?:single\s+)?(?:ready|unblocked)\b|[^\n]*\b(?:ready|unblocked)\s+(?:ticket|next action|next work)\b[^\n]{0,80}\b(?:ticket\s*)?01\b)[^\n]*$'''

schema_version = 1
id = "wayfinder-uncommitted-transient-artifact-retires"
name = "Uncommitted transient artifact may retire"
fixture = "wayfinder-reference-settlement"
request = "Resolve U17 in the named provider-state effort. U17's exact current contents never entered Git, but its answer is established and it has no independent current value. Reconcile map.md, E12, and D4 so no current reference depends on U17, then remove U17 without creating bookkeeping state. Do not treat absent Git history as a blocker."
starting_state = [
  "U17 is a transient current navigation artifact whose exact contents are not in Git.",
  "The answer and independently useful E12, F8, and D4 information can remain current without U17.",
]
expect = [
  "task_completed",
  "existing_state_reused",
  "meaningful_repository_change",
  "project_state_preserved",
]
must_not = [
  "overwrite_project_owned_state",
  "invent_unknown_answers",
]
live = false
preserve_paths = [
  ".agent-wayfinder/provider-state/facts.md",
]
forbid_created_globs = []
state_must_include = [
  ".agent-wayfinder/provider-state/map.md",
  ".agent-wayfinder/provider-state/unknowns/U17-provider-tracker-state.md",
  ".agent-wayfinder/provider-state/evidence/E12-provider-configuration.md",
  ".agent-wayfinder/provider-state/facts.md",
  ".agent-wayfinder/provider-state/decisions.md",
]
state_must_not_include = []
report_must_include = [
  "U17 retired",
  "current references reconciled",
]

[[assertions]]
kind = "path_not_exists"
path = ".agent-wayfinder/provider-state/unknowns/U17-provider-tracker-state.md"

[[assertions]]
kind = "path_not_contains"
path = ".agent-wayfinder/provider-state/map.md"
value = "U17"

[[assertions]]
kind = "path_not_contains"
path = ".agent-wayfinder/provider-state/evidence/E12-provider-configuration.md"
value = "U17"

[[assertions]]
kind = "path_not_contains"
path = ".agent-wayfinder/provider-state/decisions.md"
value = "U17"

[[assertions]]
kind = "path_exists"
path = ".agent-wayfinder/provider-state/facts.md"

[[assertions]]
kind = "path_exists"
path = ".agent-wayfinder/provider-state/decisions.md"

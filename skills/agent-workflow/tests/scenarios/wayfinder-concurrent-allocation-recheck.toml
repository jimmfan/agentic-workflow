schema_version = 1
id = "wayfinder-concurrent-allocation-recheck"
name = "Concurrent allocation retries from current state"
fixture = "wayfinder-settlement"
request = "Resume settled-provider-direction. The project owner commits to verify runtime parity before rollout; record that exact choice as the next D#. There is no current decision on the first read, but another session acquires the effort mutation lock and creates D1 before this write. Acquire the same lock, reread the decisions directory, preserve D1, and create D2 without overwriting it."
starting_state = [
  "A historical D1 has left current knowledge and does not reserve its number.",
  "A concurrent session creates a new current D1 after the first directory read.",
  "The current session must serialize on the effort mutation lock and use the new current maximum.",
]
expect = [
  "task_completed",
  "existing_state_reused",
  "meaningful_repository_change",
  "project_state_preserved",
]
must_not = [
  "overwrite_project_owned_state",
  "silent_decision_invention",
]
live = false
preserve_paths = []
forbid_created_globs = [
  ".agent-wayfinder/settled-provider-direction/decisions/D3-*.md",
]
state_must_include = [
  ".agent-wayfinder/settled-provider-direction/map.md",
]
state_must_not_include = [
  ".agent-wayfinder/wayfinder-lifecycle-completed/map.md",
]

[[assertions]]
kind = "glob_count"
path = ".agent-wayfinder/settled-provider-direction/decisions/D1-*.md"
count = 1

[[assertions]]
kind = "glob_count"
path = ".agent-wayfinder/settled-provider-direction/decisions/D2-*.md"
count = 1

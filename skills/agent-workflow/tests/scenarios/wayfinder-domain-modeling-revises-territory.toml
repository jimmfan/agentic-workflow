schema_version = 1
id = "wayfinder-domain-modeling-revises-territory"
name = "New source evidence lets Domain Modeling revise areas and relationships"
fixture = "wayfinder-territory-invalidation"
request = "Resume `.agent-wayfinder/policy-execution-migration/map.md` and reconcile it against the accepted architecture.md. Do not preserve contradicted structure, create a replacement effort, or implement the migration."
starting_state = [
  "The selected current map has now-invalid combined-service areas and relationships.",
  "architecture.md establishes changed boundaries, responsibilities, and relationships for this project.",
  "The accepted artifact resolves the areas and relationships without independently useful U/E/F/D state.",
  "The user grants action authorization for repository-local Wayfinder reconciliation.",
]
expect = [
  "task_completed",
  "existing_state_reused",
  "meaningful_repository_change",
  "project_state_preserved",
]
must_not = [
  "overwrite_project_owned_state",
  "silent_decision_invention",
  "manufacture_uncertainty",
]
live = false
verification_command = "Confirm that the existing map was revised in place to match architecture.md, the stale combined-service structure is gone, and no parallel effort was created."
preserve_paths = ["architecture.md"]
report_must_include = ["Domain Modeling"]
forbid_created_globs = [
  ".scratch/**",
  ".agent-wayfinder/policy-control-plane",
  ".agent-wayfinder/policy-control-plane/**",
  ".agent-wayfinder/policy-execution-migration-v2",
  ".agent-wayfinder/policy-execution-migration-v2/**",
  ".agent-wayfinder/policy-execution-migration/unknowns/**",
  ".agent-wayfinder/policy-execution-migration/evidence/**",
  ".agent-wayfinder/policy-execution-migration/facts.md",
  ".agent-wayfinder/policy-execution-migration/decisions.md",
]
state_must_include = [
  ".agent-wayfinder/policy-execution-migration/map.md",
]

[[assertions]]
kind = "path_contains"
path = ".agent-wayfinder/policy-execution-migration/map.md"
value = "Policy control plane"

[[assertions]]
kind = "path_contains"
path = ".agent-wayfinder/policy-execution-migration/map.md"
value = "Execution data plane"

[[assertions]]
kind = "path_contains"
path = ".agent-wayfinder/policy-execution-migration/map.md"
value = "Audit boundary"

[[assertions]]
kind = "path_contains"
path = ".agent-wayfinder/policy-execution-migration/map.md"
value = "depends on"

[[assertions]]
kind = "path_not_contains"
path = ".agent-wayfinder/policy-execution-migration/map.md"
value = "Control service owns policy evaluation and execution"

[[assertions]]
kind = "glob_count"
path = ".agent-wayfinder/*/map.md"
count = 1

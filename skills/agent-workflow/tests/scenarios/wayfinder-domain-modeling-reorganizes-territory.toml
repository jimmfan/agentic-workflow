schema_version = 1
id = "wayfinder-domain-modeling-reorganizes-territory"
name = "Domain Modeling improves mappable but poorly organized territory"
fixture = "wayfinder-reorganize-territory"
request = "Use Wayfinder to orient the policy execution migration described by the repository. Do not implement it or publish tickets."
starting_state = [
  "The destination and scope are sufficiently clear to map directly.",
  "The current flat vocabulary hides distinct responsibilities and their dependency.",
  "Repository-local Wayfinder writes are authorized.",
]
expect = [
  "task_completed",
  "meaningful_repository_change",
]
must_not = [
  "manufacture_uncertainty",
  "silent_decision_invention",
]
live = false
blind_grading = true
verification_command = "Confirm that the map organizes intake, evaluation, and execution as distinct related territory without manufacturing U/E/F/D children or a second planning system."
preserve_paths = []
report_must_include = ["Domain Modeling"]
forbid_created_globs = [
  ".scratch/**",
  ".agent-wayfinder/policy-execution-migration/facts.md",
  ".agent-wayfinder/policy-execution-migration/decisions.md",
  ".agent-wayfinder/policy-execution-migration/tickets/**",
]

[[assertions]]
kind = "path_exists"
path = ".agent-wayfinder/policy-execution-migration/map.md"

[[assertions]]
kind = "path_contains"
path = ".agent-wayfinder/policy-execution-migration/map.md"
value = "Policy intake"

[[assertions]]
kind = "path_contains"
path = ".agent-wayfinder/policy-execution-migration/map.md"
value = "Policy evaluation"

[[assertions]]
kind = "path_contains"
path = ".agent-wayfinder/policy-execution-migration/map.md"
value = "Execution runtime"

[[assertions]]
kind = "path_contains"
path = ".agent-wayfinder/policy-execution-migration/map.md"
value = "depends on"

[[assertions]]
kind = "path_not_exists"
path = ".agent-wayfinder/policy-execution-migration/unknowns"

[[assertions]]
kind = "path_not_exists"
path = ".agent-wayfinder/policy-execution-migration/evidence"

[[assertions]]
kind = "path_not_exists"
path = ".agent-wayfinder/policy-execution-migration/facts.md"

[[assertions]]
kind = "path_not_exists"
path = ".agent-wayfinder/policy-execution-migration/decisions.md"

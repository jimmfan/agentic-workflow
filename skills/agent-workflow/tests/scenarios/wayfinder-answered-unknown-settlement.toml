schema_version = 1
id = "wayfinder-answered-unknown-settlement"
name = "Completed effort moves lasting results to their designated project artifact and ends"
fixture = "wayfinder-reference-settlement"
request = "Resume the named release-direction effort, complete it, and end it. U17 is answered, source.txt establishes the scoped fact, and the choice in D4 is committed by project decision authority. Move the lasting fact and choice into concise docs/release-direction.md, the project document designated to maintain them; reconcile known references; prune redundant U17, E12, F8, and D4; then end the effort by removing map.md last after rereading the directly affected records and references. Leave project-notes.txt and its containing directory untouched. Create no ADR, ticket, tombstone, redirect map, or archive."
starting_state = [
  "This effort currently contains U17, E12, F8, and D4.",
  "Source constraint is an active semantic area whose source-supported fact and choice committed by project decision authority are ready for the project document designated to maintain them.",
  "Once docs/release-direction.md carries the lasting outcome, this effort has no legitimate continuation or ready work and no recognized Wayfinder state retains independent value.",
]
expect = [
  "task_completed",
  "existing_state_reused",
  "meaningful_repository_change",
  "project_state_preserved",
]
must_not = [
  "overwrite_project_owned_state",
  "unnecessary_planning_artifacts",
]
live = false
preserve_paths = [
  "source.txt",
  ".agent-wayfinder/release-direction/project-notes.txt",
]
forbid_created_globs = [
  "architecture-decisions",
  "architecture-decisions/**",
  "issues",
  "issues/**",
]
state_must_include = [
  ".agent-wayfinder/release-direction/map.md",
  ".agent-wayfinder/release-direction/unknowns/U17-source-constraint.md",
  ".agent-wayfinder/release-direction/evidence/E12-source-observation.md",
  ".agent-wayfinder/release-direction/facts.md",
  ".agent-wayfinder/release-direction/decisions.md",
  "source.txt",
]
state_must_not_include = [
  ".agent-wayfinder/release-direction/project-notes.txt",
]

[[assertions]]
kind = "path_not_exists"
path = ".agent-wayfinder/release-direction/unknowns/U17-source-constraint.md"

[[assertions]]
kind = "path_not_exists"
path = ".agent-wayfinder/release-direction/evidence/E12-source-observation.md"

[[assertions]]
kind = "path_not_exists"
path = ".agent-wayfinder/release-direction/facts.md"

[[assertions]]
kind = "path_not_exists"
path = ".agent-wayfinder/release-direction/decisions.md"

[[assertions]]
kind = "path_exists"
path = "docs/release-direction.md"

[[assertions]]
kind = "path_contains"
path = "docs/release-direction.md"
value = "release_mode=staged"

[[assertions]]
kind = "path_contains"
path = "docs/release-direction.md"
value = "Adopt the staged release direction"

[[assertions]]
kind = "path_not_exists"
path = ".agent-wayfinder/release-direction/map.md"

[[assertions]]
kind = "path_exists"
path = ".agent-wayfinder/release-direction/project-notes.txt"

[[assertions]]
kind = "path_contains"
path = ".agent-wayfinder/release-direction/project-notes.txt"
value = "project-owned note"

[[assertions]]
kind = "path_not_exists"
path = "architecture-decisions"

[[assertions]]
kind = "path_not_exists"
path = "issues"

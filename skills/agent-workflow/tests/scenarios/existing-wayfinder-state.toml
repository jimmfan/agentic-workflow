schema_version = 1
id = "existing-wayfinder-state"
name = "Existing Wayfinder decisions are consumed and affected state is reconciled"
fixture = "wayfinder-existing"
request = "Continue as a fresh session from the existing Wayfinder map, retrieve its linked D1 section from decisions.md, implement the next actionable slice, and verify it. Preserve unresolved non-blocking unknowns without loading their detail."
starting_state = [
  "A canonical local Wayfinder map points directly to a settled D1 section in decisions.md.",
  "The map states the actionable implementation slice under Next work.",
  "The telemetry-naming uncertainty recorded in U1 does not block the actionable implementation slice.",
]
expect = [
  "task_completed",
  "existing_state_reused",
  "meaningful_repository_change",
  "verification_performed",
  "project_state_preserved",
]
must_not = [
  "repeat_resolved_discovery",
  "overwrite_project_owned_state",
]
live = false
verification_command = "Run python verify.py after implementing serialize_payload."
preserve_paths = [
  ".agent-wayfinder/response-serialization/unknowns/U1-name-telemetry-metric.md",
  ".agent-wayfinder/response-serialization/decisions.md",
  ".agent-wayfinder/unrelated-billing-migration/map.md",
]
forbid_created_globs = [
  "docs/decisions/**",
  ".agent-wayfinder/response-serialization/unknowns/U2*.md",
  ".agent-wayfinder/response-serialization/tickets",
  ".agent-wayfinder/response-serialization/tickets/**",
  ".scratch/**",
]
route_must_not_include = ["discovery", "wayfinder"]
state_must_include = [
  ".agent-wayfinder/response-serialization/map.md",
  ".agent-wayfinder/response-serialization/decisions.md",
]
state_must_not_include = [
  ".agent-wayfinder/response-serialization/unknowns/U1-name-telemetry-metric.md",
  ".agent-wayfinder/unrelated-billing-migration/map.md",
]

[[assertions]]
kind = "path_not_contains"
path = "service.py"
value = "NotImplementedError"

[[assertions]]
kind = "path_not_contains"
path = ".agent-wayfinder/response-serialization/map.md"
value = "Implement `serialize_payload` in `service.py` using D1"

schema_version = 1
id = "wayfinder-new-effort"
name = "Consequential migration goal starts one lightweight effort"
fixture = "wayfinder-new"
request = "We need to complete the zero-downtime platform cutover described in migration-architecture.md. Migration ordering is unresolved, final transition approval belongs to the project owner, and consumer inventory work can proceed while rollback and cutover sequencing are worked out. Determine what can proceed now and what remains unresolved."
starting_state = [
  "migration-architecture.md is accepted project architecture for this migration.",
  "The Project owner role accepted zero downtime, while safe migration ordering has not been chosen.",
  "Repository-local coordination changes are authorized, but external tracker mutation is not.",
]
expect = [
  "task_completed",
  "uncertainty_recorded_or_blocked",
  "meaningful_repository_change",
]
must_not = [
  "unnecessary_planning_artifacts",
  "overwrite_project_owned_state",
]
live = false
verification_command = "Validate that exactly one map-first effort records the objective, bounded scope, relevant areas and relationships, dependencies, unresolved coordination, and ready work without creating tickets or a parallel tracker."
preserve_paths = ["migration-architecture.md"]
route_must_include = ["wayfinder"]
route_must_not_include = ["domain-modeling"]
forbid_created_globs = [
  "issues",
  "issues/**",
  ".agent-wayfinder/*/tickets",
  ".agent-wayfinder/*/tickets/**",
]

[[assertions]]
kind = "glob_count"
path = ".agent-wayfinder/*/map.md"
count = 1

[[assertions]]
kind = "glob_contains"
path = ".agent-wayfinder/*/map.md"
value = "## Objective"

[[assertions]]
kind = "glob_contains"
path = ".agent-wayfinder/*/map.md"
value = "zero-downtime"

[[assertions]]
kind = "glob_contains"
path = ".agent-wayfinder/*/map.md"
value = "## Scope"

[[assertions]]
kind = "glob_contains"
path = ".agent-wayfinder/*/map.md"
value = "unrelated product behavior"

[[assertions]]
kind = "glob_contains"
path = ".agent-wayfinder/*/map.md"
value = "## Areas and relationships"

[[assertions]]
kind = "glob_contains"
path = ".agent-wayfinder/*/map.md"
value = "## Current state"

[[assertions]]
kind = "glob_contains"
path = ".agent-wayfinder/*/map.md"
value = "## Blockers and dependencies"

[[assertions]]
kind = "glob_contains"
path = ".agent-wayfinder/*/map.md"
value = "Consumer inventory"

[[assertions]]
kind = "glob_contains"
path = ".agent-wayfinder/*/map.md"
value = "Cutover orchestration"

[[assertions]]
kind = "glob_contains"
path = ".agent-wayfinder/*/map.md"
value = "Rollback"

[[assertions]]
kind = "glob_contains"
path = ".agent-wayfinder/*/map.md"
value = "depends on"

[[assertions]]
kind = "glob_contains"
path = ".agent-wayfinder/*/map.md"
value = "D1"

[[assertions]]
kind = "glob_contains"
path = ".agent-wayfinder/*/map.md"
value = "U1"

[[assertions]]
kind = "glob_contains"
path = ".agent-wayfinder/*/map.md"
value = "## Ready work"

[[assertions]]
kind = "glob_none_contains"
path = ".agent-wayfinder/*/map.md"
value = "## Question"

[[assertions]]
kind = "glob_none_contains"
path = ".agent-wayfinder/*/map.md"
value = "## Acceptance"

[[assertions]]
kind = "glob_count"
path = ".agent-wayfinder/*/unknowns/U*.md"
count = 1

[[assertions]]
kind = "glob_contains"
path = ".agent-wayfinder/*/unknowns/U1-*.md"
value = "migration order"

[[assertions]]
kind = "glob_count"
path = ".agent-wayfinder/*/decisions.md"
count = 1

[[assertions]]
kind = "glob_any_matches"
path = ".agent-wayfinder/*/decisions.md"
value = '''\A# Decisions\n'''

[[assertions]]
kind = "glob_contains"
path = ".agent-wayfinder/*/decisions.md"
value = "## D1"

[[assertions]]
kind = "glob_contains"
path = ".agent-wayfinder/*/decisions.md"
value = "zero-downtime"

[[assertions]]
kind = "glob_contains"
path = ".agent-wayfinder/*/decisions.md"
value = "- Authority: Project owner"

[[assertions]]
kind = "glob_contains"
path = ".agent-wayfinder/*/decisions.md"
value = "- Based on:"

[[assertions]]
kind = "glob_contains"
path = ".agent-wayfinder/*/decisions.md"
value = "- Consequences:"

[[assertions]]
kind = "glob_any_matches"
path = ".agent-wayfinder/*/map.md"
value = '''\]\(decisions\.md#d1--[a-z0-9-]+\)'''

[[assertions]]
kind = "path_not_exists"
path = "issues"

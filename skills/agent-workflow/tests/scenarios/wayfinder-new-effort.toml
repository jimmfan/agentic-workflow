schema_version = 1
id = "wayfinder-new-effort"
name = "Complicated migration planning starts lightweight durable state"
fixture = "wayfinder-new"
request = "Plan our zero-downtime platform migration. Reuse migration-architecture.md for the destination, boundary, major areas, and relationships; that authoritative structure is already clear, so do not rerun Domain Modeling. Preserve unresolved ordering separately and identify concrete work that can begin while part of the plan is blocked."
starting_state = [
  "Several important pieces of migration state are becoming unreliable to hold only in conversational context.",
  "migration-architecture.md authoritatively defines consumer inventory, cutover orchestration, rollback, ownership, and their seams; migration ordering remains unresolved.",
  "Repository-local durable planning is authorized, but no external tracker mutation is authorized.",
]
expect = [
  "task_completed",
  "uncertainty_recorded_or_blocked",
  "meaningful_repository_change",
]
must_not = [
  "overwrite_project_owned_state",
]
live = false
verification_command = "Validate that the resulting repository-local planning state preserves the destination, current state, blockers, decisions, unknowns, and next work without creating Wayfinder tickets, a global active file, or a parallel copy."
preserve_paths = ["migration-architecture.md"]
route_must_not_include = ["domain-modeling"]
forbid_created_globs = [
  ".agent-wayfinder/active.md",
  ".agent-wayfinder/archive",
  ".agent-wayfinder/archive/**",
  ".agent-wayfinder/planning",
  ".agent-wayfinder/planning/**",
  ".agent-wayfinder/records",
  ".agent-wayfinder/records/**",
  ".agent-wayfinder/state",
  ".agent-wayfinder/state/**",
  ".planning",
  ".planning/**",
  ".scratch",
  ".scratch/**",
  ".jira",
  ".jira/**",
  "issues",
  "issues/**",
  "jira",
  "jira/**",
  "planning",
  "planning/**",
  "wayfinder",
  "wayfinder/**",
  ".agent-wayfinder/platform-migration/tickets",
  ".agent-wayfinder/platform-migration/tickets/**",
]

[[assertions]]
kind = "path_exists"
path = ".agent-wayfinder/platform-migration/map.md"

[[assertions]]
kind = "path_contains"
path = ".agent-wayfinder/platform-migration/map.md"
value = "## Destination"

[[assertions]]
kind = "path_contains"
path = ".agent-wayfinder/platform-migration/map.md"
value = "## Notes"

[[assertions]]
kind = "path_contains"
path = ".agent-wayfinder/platform-migration/map.md"
value = "## Current state"

[[assertions]]
kind = "path_contains"
path = ".agent-wayfinder/platform-migration/map.md"
value = "## Territory"

[[assertions]]
kind = "path_contains"
path = ".agent-wayfinder/platform-migration/map.md"
value = "Consumer inventory"

[[assertions]]
kind = "path_contains"
path = ".agent-wayfinder/platform-migration/map.md"
value = "Cutover orchestration"

[[assertions]]
kind = "path_contains"
path = ".agent-wayfinder/platform-migration/map.md"
value = "Rollback"

[[assertions]]
kind = "path_contains"
path = ".agent-wayfinder/platform-migration/map.md"
value = "depends on"

[[assertions]]
kind = "path_contains"
path = ".agent-wayfinder/platform-migration/map.md"
value = "## Blockers and dependencies"

[[assertions]]
kind = "path_contains"
path = ".agent-wayfinder/platform-migration/map.md"
value = "## Next work"

[[assertions]]
kind = "path_contains"
path = ".agent-wayfinder/platform-migration/map.md"
value = "## Decisions so far"

[[assertions]]
kind = "path_contains"
path = ".agent-wayfinder/platform-migration/map.md"
value = "## Not yet specified"

[[assertions]]
kind = "path_contains"
path = ".agent-wayfinder/platform-migration/map.md"
value = "## Out of scope"

[[assertions]]
kind = "path_contains"
path = ".agent-wayfinder/platform-migration/map.md"
value = "D1"

[[assertions]]
kind = "path_contains"
path = ".agent-wayfinder/platform-migration/map.md"
value = "U1"

[[assertions]]
kind = "path_contains"
path = ".agent-wayfinder/platform-migration/map.md"
value = "consumer"

[[assertions]]
kind = "path_not_contains"
path = ".agent-wayfinder/platform-migration/map.md"
value = "## Question"

[[assertions]]
kind = "path_not_contains"
path = ".agent-wayfinder/platform-migration/map.md"
value = "## Acceptance"

[[assertions]]
kind = "glob_count"
path = ".agent-wayfinder/platform-migration/unknowns/U*.md"
count = 1

[[assertions]]
kind = "glob_contains"
path = ".agent-wayfinder/platform-migration/unknowns/U1-*.md"
value = "migration order"

[[assertions]]
kind = "glob_count"
path = ".agent-wayfinder/platform-migration/decisions/D*.md"
count = 1

[[assertions]]
kind = "glob_contains"
path = ".agent-wayfinder/platform-migration/decisions/D1-*.md"
value = "downtime"

[[assertions]]
kind = "path_not_exists"
path = ".agent-wayfinder/active.md"

[[assertions]]
kind = "path_not_exists"
path = ".scratch"

[[assertions]]
kind = "path_not_exists"
path = ".agent-wayfinder/records"

[[assertions]]
kind = "path_not_exists"

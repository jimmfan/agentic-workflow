schema_version = 1
id = "wayfinder-new-effort"
name = "Complicated migration planning starts lightweight durable state"
fixture = "wayfinder-new"
request = "Plan our zero-downtime platform migration. Reuse the objective, scope, major areas, and relationships established by migration-architecture.md; that structure is already clear, so do not rerun Domain Modeling. Preserve unresolved ordering separately and identify concrete work that can begin while part of the plan is blocked."
starting_state = [
  "Several important pieces of migration state are becoming unreliable to hold only in conversational context.",
  "migration-architecture.md establishes consumer inventory, cutover orchestration, rollback, ownership, and their seams; project decision authority in the Project owner role accepted zero downtime, while migration ordering remains unresolved.",
  "The user grants action authorization for repository-local durable planning, but not for external tracker mutation.",
]
expect = [
  "task_completed",
  "uncertainty_recorded_or_blocked",
  "meaningful_repository_change",
]
must_not = [
  "overwrite_project_owned_state",
]
live = false
verification_command = "Validate that the resulting repository-local planning state preserves the objective, scope, current coordination state, conditions blocking particular work, dependencies, committed choices, unresolved questions, and ready work without creating Wayfinder tickets or a parallel tracker ticket copy."
preserve_paths = ["migration-architecture.md"]
route_must_not_include = ["domain-modeling"]
forbid_created_globs = [
  ".scratch",
  ".scratch/**",
  "issues",
  "issues/**",
  ".agent-wayfinder/platform-migration/tickets",
  ".agent-wayfinder/platform-migration/tickets/**",
]

[[assertions]]
kind = "path_exists"
path = ".agent-wayfinder/platform-migration/map.md"

[[assertions]]
kind = "path_contains"
path = ".agent-wayfinder/platform-migration/map.md"
value = "Consumer inventory"

[[assertions]]
kind = "path_contains"
path = ".agent-wayfinder/platform-migration/map.md"
value = "Cutover orchestration"

[[assertions]]
kind = "path_contains"
path = ".agent-wayfinder/platform-migration/map.md"
value = "Rollback"

[[assertions]]
kind = "path_contains"
path = ".agent-wayfinder/platform-migration/map.md"
value = "depends on"

[[assertions]]
kind = "path_contains"
path = ".agent-wayfinder/platform-migration/map.md"
value = "D1"

[[assertions]]
kind = "path_contains"
path = ".agent-wayfinder/platform-migration/map.md"
value = "U1"

[[assertions]]
kind = "path_contains"
path = ".agent-wayfinder/platform-migration/map.md"
value = "consumer"

[[assertions]]
kind = "path_not_contains"
path = ".agent-wayfinder/platform-migration/map.md"
value = "## Question"

[[assertions]]
kind = "path_not_contains"
path = ".agent-wayfinder/platform-migration/map.md"
value = "## Acceptance"

[[assertions]]
kind = "glob_count"
path = ".agent-wayfinder/platform-migration/unknowns/U*.md"
count = 1

[[assertions]]
kind = "glob_contains"
path = ".agent-wayfinder/platform-migration/unknowns/U1-*.md"
value = "migration order"

[[assertions]]
kind = "path_exists"
path = ".agent-wayfinder/platform-migration/decisions.md"

[[assertions]]
kind = "glob_any_matches"
path = ".agent-wayfinder/platform-migration/decisions.md"
value = '''\A# Decisions\n'''

[[assertions]]
kind = "path_contains"
path = ".agent-wayfinder/platform-migration/decisions.md"
value = "## D1 — Use a zero-downtime cutover"

[[assertions]]
kind = "path_contains"
path = ".agent-wayfinder/platform-migration/decisions.md"
value = "- Authority: Project owner"

[[assertions]]
kind = "path_contains"
path = ".agent-wayfinder/platform-migration/decisions.md"
value = "- Based on:"

[[assertions]]
kind = "path_contains"
path = ".agent-wayfinder/platform-migration/decisions.md"
value = "- Consequences:"

[[assertions]]
kind = "path_contains"
path = ".agent-wayfinder/platform-migration/map.md"
value = "](decisions.md#d1--use-a-zero-downtime-cutover)"

[[assertions]]
kind = "path_not_exists"
path = ".scratch"

[[assertions]]
kind = "path_not_exists"
path = "issues"

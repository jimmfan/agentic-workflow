schema_version = 1
id = "wayfinder-answered-unknown-authority-choice"
name = "Authority answer retires the dependent unknown"
fixture = "wayfinder-authority-answer"
request = "Resume the rollout-choice Wayfinder effort. As the responsible project owner, I choose Option B: a staged rollout. Preserve that durable choice in the proper current owner, reconcile the release-checklist dependency and ready frontier, then retire the answered U1. Preserve unrelated state. Do not implement the rollout, create an ADR or ticket, or treat the empty unknowns directory as state."
starting_state = [
  "U1 is a current unresolved consequential authority-owned question.",
  "The release checklist is a dependent current item blocked by U1.",
  "The effort contains unrelated project-owned state that must remain unchanged.",
]
expect = [
  "existing_state_reused",
  "meaningful_repository_change",
  "project_state_preserved",
]
must_not = [
  "overwrite_project_owned_state",
  "unnecessary_planning_artifacts",
]
live = true
blind_grading = false
preserve_paths = [
  "README.md",
  ".agent-wayfinder/rollout-choice/unrelated-notes.md",
]
forbid_created_globs = [
  "architecture-decisions",
  "architecture-decisions/**",
  "issues",
  "issues/**",
  ".agent-wayfinder/*/tickets",
  ".agent-wayfinder/*/tickets/**",
]
state_must_include = [
  ".agent-wayfinder/rollout-choice/map.md",
  ".agent-wayfinder/rollout-choice/unknowns/U1-rollout-strategy.md",
]
state_must_not_include = [
  ".agent-wayfinder/rollout-choice/unrelated-notes.md",
]

[[assertions]]
kind = "path_not_exists"
path = ".agent-wayfinder/rollout-choice/unknowns/U1-rollout-strategy.md"

[[assertions]]
kind = "path_exists"
path = ".agent-wayfinder/rollout-choice/decisions.md"

[[assertions]]
kind = "path_contains"
path = ".agent-wayfinder/rollout-choice/decisions.md"
value = "Option B"

[[assertions]]
kind = "path_contains"
path = ".agent-wayfinder/rollout-choice/decisions.md"
value = "responsible project owner"

[[assertions]]
kind = "path_not_contains"
path = ".agent-wayfinder/rollout-choice/map.md"
value = "U1"

[[assertions]]
kind = "path_contains"
path = ".agent-wayfinder/rollout-choice/map.md"
value = "Option B"

[[assertions]]
kind = "path_contains"
path = ".agent-wayfinder/rollout-choice/map.md"
value = "release checklist"

[[assertions]]
kind = "path_contains"
path = ".agent-wayfinder/rollout-choice/map.md"
value = "ready"

[[assertions]]
kind = "path_not_exists"
path = "architecture-decisions"

[[assertions]]
kind = "path_not_exists"
path = "issues"

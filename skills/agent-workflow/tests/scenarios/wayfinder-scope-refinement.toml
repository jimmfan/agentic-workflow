schema_version = 1
id = "wayfinder-scope-refinement"
name = "New evidence refines scope within the same effort"
fixture = "wayfinder-territory-invalidation"
request = "The accepted architecture.md now clarifies the policy execution migration boundary. Update the coordination for this migration to reflect the current areas and handoffs, identify what can proceed now, and leave implementation untouched."
starting_state = [
  "architecture.md records the accepted policy execution architecture.",
  "Repository-local coordination changes are authorized; implementation and unrelated effort changes are not.",
]
expect = [
  "task_completed",
  "existing_state_reused",
  "meaningful_repository_change",
  "project_state_preserved",
]
must_not = [
  "unnecessary_planning_artifacts",
  "overwrite_project_owned_state",
  "silent_decision_invention",
]
live = false
blind_grading = true
verification_command = "Confirm that the existing policy execution migration map was refined in place from architecture.md, the unrelated audit-retention effort is untouched, and no synonymous or sibling effort was created."
preserve_paths = [
  "architecture.md",
  ".agent-wayfinder/audit-retention/map.md",
]
route_must_include = ["wayfinder"]
route_must_not_include = ["domain-modeling"]
state_must_include = [
  ".agent-wayfinder/policy-execution-migration/map.md",
]
state_must_not_include = [
  ".agent-wayfinder/audit-retention/map.md",
]
forbid_created_globs = [
  "*",
]

[[assertions]]
kind = "path_exists"
path = ".agent-wayfinder/policy-execution-migration/map.md"

[[assertions]]
kind = "path_contains"
path = ".agent-wayfinder/policy-execution-migration/map.md"
value = "Policy control plane"

[[assertions]]
kind = "path_contains"
path = ".agent-wayfinder/policy-execution-migration/map.md"
value = "Execution data plane"

[[assertions]]
kind = "path_contains"
path = ".agent-wayfinder/policy-execution-migration/map.md"
value = "Audit boundary"

[[assertions]]
kind = "path_contains"
path = ".agent-wayfinder/policy-execution-migration/map.md"
value = "approved intent"

[[assertions]]
kind = "glob_any_matches"
path = ".agent-wayfinder/policy-execution-migration/map.md"
value = '''(?x)
\b(?:
  inventor(?:y|ying)\s+call\s+sites\b[^.!?]*\b(?:can|may)\s+(?:proceed|start|begin)
  | inventor(?:y|ying)\s+call\s+sites\s+(?:is|remains)\s+ready
  | (?:ready|independent)\s+work\s*:?\s*[-*]?\s*inventor(?:y|ying)\s+call\s+sites
)\b
'''

[[assertions]]
kind = "glob_none_matches"
path = ".agent-wayfinder/policy-execution-migration/map.md"
value = '''\binventor(?:y|ying)\s+call\s+sites\b[^.!?]*\b(?:is\s+(?:not\s+ready|blocked)|must\s+wait|cannot\s+proceed)\b'''

[[assertions]]
kind = "glob_any_matches"
path = ".agent-wayfinder/policy-execution-migration/map.md"
value = '''(?x)
\b(?:
  (?:approved[- ]intent\s+)?handoff\s+schema\s+(?:(?:is|remains)\s+)?(?:unresolved|pending|undecided|not\s+yet\s+(?:settled|chosen))
  | (?:unresolved|pending|undecided)\s+(?:approved[- ]intent\s+)?handoff\s+schema
)\b
'''

[[assertions]]
kind = "path_not_contains"
path = ".agent-wayfinder/policy-execution-migration/map.md"
value = "The combined service model is treated as authoritative"

[[assertions]]
kind = "glob_none_matches"
path = ".agent-wayfinder/policy-execution-migration/map.md"
value = '''#{1,6}\s+(?:Blockers(?: and dependencies)?|Dependencies)\s*\n+None\.?\s*(?:\n|\Z)'''

[[assertions]]
kind = "path_not_contains"
path = ".agent-wayfinder/policy-execution-migration/map.md"
value = "Control service owns policy evaluation and execution"

[[assertions]]
kind = "glob_count"
path = ".agent-wayfinder/*/map.md"
count = 2

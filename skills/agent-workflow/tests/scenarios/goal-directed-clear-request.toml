schema_version = 1
id = "goal-directed-clear-request"
name = "Clear desired outcome stays on the minimum route"
fixture = "simple-project"
request = "Change greeting() to return the product greeting `hello, world!` under its existing signature, then run python verify.py."
starting_state = [
  "The complete desired outcome, affected function, scope, and verification command are explicit.",
  "No consequential uncertainty, dependency, choice, involved area, or continuity need remains.",
]
expect = [
  "task_completed",
  "meaningful_repository_change",
  "verification_performed",
  "project_state_preserved",
]
must_not = [
  "unnecessary_planning_artifacts",
  "manufacture_uncertainty",
  "overwrite_project_owned_state",
]
live = false
verification_command = "Run python verify.py after updating app.py."
preserve_paths = ["README.md", "verify.py"]
forbid_created_globs = [
  ".agent-wayfinder/**",
  "planning/**",
  "wayfinder/**",
]
route_must_include = []
route_must_not_include = ["wayfinder"]

[[assertions]]
kind = "path_contains"
path = "app.py"
value = '''return "hello, world!"'''

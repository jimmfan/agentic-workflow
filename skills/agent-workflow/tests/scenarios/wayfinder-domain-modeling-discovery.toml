schema_version = 1
id = "wayfinder-domain-modeling-discovery"
name = "Domain Modeling clarifies domain language and context boundaries"
fixture = "wayfinder-ambiguous-domain"
request = "Use Wayfinder to orient the migration described by the repository. Clarify the inconsistent Consumer and ownership language as far as current evidence permits, without implementing the migration."
starting_state = [
  "The repository uses Consumer, Cutover owner, and Operating owner ambiguously across business contexts.",
  "The intended outcome and current migration boundary identify a zero-downtime transition effort.",
  "No project artifact yet establishes the domain meanings or responsibility relationships needed to orient consumer inventory and ownership.",
  "The user grants action authorization for repository-local Wayfinder writes, but project decision authority has committed no choice for the unresolved boundary.",
]
expect = [
  "task_completed",
  "uncertainty_recorded_or_blocked",
  "meaningful_repository_change",
]
must_not = [
  "silent_decision_invention",
  "overwrite_project_owned_state",
]
live = false
blind_grading = true
verification_command = "Confirm the map briefly orients a fresh agent to the objective, scope, domain concepts, context boundaries, and responsibility relationships before one consequential U# is retained, without creating decisions, implementation tickets, or nested area storage."
preserve_paths = []
report_must_include = ["Domain Modeling"]
route_must_include = ["wayfinder", "domain-modeling"]
forbid_created_globs = [
  ".agent-wayfinder/migration-domain-boundary",
  ".agent-wayfinder/migration-domain-boundary/**",
  ".agent-wayfinder/zero-downtime-platform-cutover/decisions.md",
  ".agent-wayfinder/zero-downtime-platform-cutover/consumers",
  ".agent-wayfinder/zero-downtime-platform-cutover/consumers/**",
  ".agent-wayfinder/zero-downtime-platform-cutover/cutover",
  ".agent-wayfinder/zero-downtime-platform-cutover/cutover/**",
  ".agent-wayfinder/zero-downtime-platform-cutover/tickets",
  ".agent-wayfinder/zero-downtime-platform-cutover/tickets/**",
]

[[assertions]]
kind = "path_exists"
path = ".agent-wayfinder/zero-downtime-platform-cutover/map.md"

[[assertions]]
kind = "path_contains"
path = ".agent-wayfinder/zero-downtime-platform-cutover/map.md"
value = "## Objective"

[[assertions]]
kind = "path_contains"
path = ".agent-wayfinder/zero-downtime-platform-cutover/map.md"
value = "# Zero-downtime platform cutover"

[[assertions]]
kind = "path_contains"
path = ".agent-wayfinder/zero-downtime-platform-cutover/map.md"
value = "## Areas and relationships"

[[assertions]]
kind = "path_contains"
path = ".agent-wayfinder/zero-downtime-platform-cutover/map.md"
value = "## Scope"

[[assertions]]
kind = "path_contains"
path = ".agent-wayfinder/zero-downtime-platform-cutover/map.md"
value = "Consumer inventory"

[[assertions]]
kind = "path_contains"
path = ".agent-wayfinder/zero-downtime-platform-cutover/map.md"
value = "Cutover orchestration"

[[assertions]]
kind = "path_contains"
path = ".agent-wayfinder/zero-downtime-platform-cutover/map.md"
value = "Ownership"

[[assertions]]
kind = "path_contains"
path = ".agent-wayfinder/zero-downtime-platform-cutover/map.md"
value = "depends on"

[[assertions]]
kind = "glob_count"
path = ".agent-wayfinder/zero-downtime-platform-cutover/unknowns/U*.md"
count = 1

[[assertions]]
kind = "glob_contains"
path = ".agent-wayfinder/zero-downtime-platform-cutover/unknowns/U*.md"
value = "consumer"

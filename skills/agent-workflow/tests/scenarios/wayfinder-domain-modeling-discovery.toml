schema_version = 1
id = "wayfinder-domain-modeling-discovery"
name = "Domain Modeling establishes ambiguous areas and relationships before child growth"
fixture = "wayfinder-ambiguous-domain"
request = "Use Wayfinder to orient the ambiguous migration described by the repository. Move it as far as current evidence permits without implementing the migration."
starting_state = [
  "The repository uses consumer and cutover boundary ambiguously.",
  "The intended outcome is a zero-downtime transition, but the durable effort name has not been chosen.",
  "No authoritative artifact yet establishes the migration's major areas or how consumer inventory, cutover orchestration, and ownership relate.",
  "Repository-local Wayfinder writes are authorized, but no authority-dependent choice has been accepted.",
]
expect = [
  "task_completed",
  "uncertainty_recorded_or_blocked",
  "meaningful_repository_change",
]
must_not = [
  "silent_decision_invention",
  "overwrite_project_owned_state",
]
live = false
blind_grading = true
verification_command = "Confirm the map briefly orients a fresh agent to the objective, scope, areas, and relationships before one consequential U# is retained, without creating decisions, implementation tickets, or nested area storage."
preserve_paths = []
report_must_include = ["Domain Modeling"]
forbid_created_globs = [
  ".agent-wayfinder/migration-domain-boundary",
  ".agent-wayfinder/migration-domain-boundary/**",
  ".agent-wayfinder/zero-downtime-platform-cutover/decisions.md",
  ".agent-wayfinder/zero-downtime-platform-cutover/consumers",
  ".agent-wayfinder/zero-downtime-platform-cutover/consumers/**",
  ".agent-wayfinder/zero-downtime-platform-cutover/cutover",
  ".agent-wayfinder/zero-downtime-platform-cutover/cutover/**",
  ".agent-wayfinder/zero-downtime-platform-cutover/tickets",
  ".agent-wayfinder/zero-downtime-platform-cutover/tickets/**",
  ".scratch/**",
]

[[assertions]]
kind = "path_exists"
path = ".agent-wayfinder/zero-downtime-platform-cutover/map.md"

[[assertions]]
kind = "path_contains"
path = ".agent-wayfinder/zero-downtime-platform-cutover/map.md"
value = "## Objective"

[[assertions]]
kind = "path_contains"
path = ".agent-wayfinder/zero-downtime-platform-cutover/map.md"
value = "# Zero-downtime platform cutover"

[[assertions]]
kind = "path_contains"
path = ".agent-wayfinder/zero-downtime-platform-cutover/map.md"
value = "## Areas and relationships"

[[assertions]]
kind = "path_contains"
path = ".agent-wayfinder/zero-downtime-platform-cutover/map.md"
value = "## Scope"

[[assertions]]
kind = "path_contains"
path = ".agent-wayfinder/zero-downtime-platform-cutover/map.md"
value = "Consumer inventory"

[[assertions]]
kind = "path_contains"
path = ".agent-wayfinder/zero-downtime-platform-cutover/map.md"
value = "Cutover orchestration"

[[assertions]]
kind = "path_contains"
path = ".agent-wayfinder/zero-downtime-platform-cutover/map.md"
value = "Ownership"

[[assertions]]
kind = "path_contains"
path = ".agent-wayfinder/zero-downtime-platform-cutover/map.md"
value = "depends on"

[[assertions]]
kind = "glob_count"
path = ".agent-wayfinder/zero-downtime-platform-cutover/unknowns/U*.md"
count = 1

[[assertions]]
kind = "glob_contains"
path = ".agent-wayfinder/zero-downtime-platform-cutover/unknowns/U*.md"
value = "consumer"

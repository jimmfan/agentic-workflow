schema_version = 1
id = "wayfinder-distinct-slug-collision"
name = "A real slug collision preserves the existing effort"
fixture = "wayfinder-effort-selection"
request = "Use Wayfinder to create the new durable effort Provider projection observability. It is materially distinct from the existing Provider projection lifecycle effort. Repository-local durable writes are authorized."
starting_state = [
  "The concise base slug provider-projection is already owned by a different objective and scope.",
  "The existing effort must not be overwritten, merged, or renamed.",
  "The shortest meaningful stable disambiguator is observability.",
]
expect = [
  "task_completed",
  "meaningful_repository_change",
  "project_state_preserved",
]
must_not = [
  "overwrite_project_owned_state",
  "unnecessary_planning_artifacts",
]
live = false
preserve_paths = [
  ".agent-wayfinder/provider-projection/map.md",
]
forbid_created_globs = [
  ".agent-wayfinder/provider-projection-2",
  ".agent-wayfinder/provider-projection-2/**",
]
state_must_include = [
  ".agent-wayfinder/provider-projection/map.md",
]
state_must_not_include = [
  ".agent-wayfinder/provider-runtime/map.md",
  ".agent-wayfinder/established-provider-naming/map.md",
]

[[assertions]]
kind = "path_exists"
path = ".agent-wayfinder/provider-projection-observability/map.md"

[[assertions]]
kind = "path_contains"
path = ".agent-wayfinder/provider-projection-observability/map.md"
value = "# Provider projection observability"

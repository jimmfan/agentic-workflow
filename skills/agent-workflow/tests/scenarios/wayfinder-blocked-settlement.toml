schema_version = 1
id = "wayfinder-blocked-settlement"
name = "Blocked resumable coordination is not settled as history"
fixture = "wayfinder-settlement"
request = "Resume the blocked provider-direction effort and assess whether it can settle. The provider checksum is still unavailable and no canonical owner can continue U1 yet. Keep the effort current and resumable, report the exact blocker, and do not create lifecycle labels or historical artifacts."
starting_state = [
  "U1 records the unresolved checksum question; the unavailable required checksum is an unsatisfied dependency that blocks verification.",
  "The effort may realistically resume when the provider publishes the checksum.",
  "A separate mapless directory contains unknown project-owned content and is not a resumable effort.",
]
expect = [
  "existing_state_reused",
  "blocked_cleanly",
  "project_state_preserved",
]
must_not = [
  "overwrite_project_owned_state",
  "unnecessary_planning_artifacts",
]
live = false
preserve_paths = [
  ".agent-wayfinder/blocked-provider-direction/map.md",
  ".agent-wayfinder/blocked-provider-direction/unknowns/U1-provider-checksum.md",
  ".agent-wayfinder/retired-provider-direction/project-notes.txt",
]
forbid_created_globs = [
  ".agent-wayfinder/**/archive/**",
  ".agent-wayfinder/**/*tombstone*",
  ".agent-wayfinder/**/*redirect*",
]
state_must_include = [
  ".agent-wayfinder/blocked-provider-direction/map.md",
  ".agent-wayfinder/blocked-provider-direction/unknowns/U1-provider-checksum.md",
]
state_must_not_include = [
  ".agent-wayfinder/retired-provider-direction/project-notes.txt",
]
report_must_include = [
  "provider checksum",
  "current and resumable",
]

[[assertions]]
kind = "path_exists"
path = ".agent-wayfinder/blocked-provider-direction/map.md"

[[assertions]]
kind = "path_exists"
path = ".agent-wayfinder/blocked-provider-direction/unknowns/U1-provider-checksum.md"

[[assertions]]
kind = "path_not_exists"
path = ".agent-wayfinder/retired-provider-direction/map.md"

[[assertions]]
kind = "path_exists"
path = ".agent-wayfinder/retired-provider-direction/project-notes.txt"

schema_version = 1
id = "wayfinder-selective-unknown-promotion"
name = "Release readiness coordination"
fixture = "wayfinder-selective-promotion"
request = "Use Wayfinder to orient the release readiness effort described in README.md. Do not publish implementation tickets or change the source documents."
starting_state = [
  "README.md is the current repository evidence for this assessment.",
  "The user grants action authorization for repository-local Wayfinder writes, but not for external mutations.",
]
expect = [
  "uncertainty_recorded_or_blocked",
  "meaningful_repository_change",
]
must_not = [
  "silent_decision_invention",
  "overwrite_project_owned_state",
]
live = true
blind_grading = true
preserve_paths = ["README.md"]
forbid_created_globs = [
  ".agent-wayfinder/*/decisions.md",
  ".agent-wayfinder/*/tickets",
  ".agent-wayfinder/*/tickets/**",
]

[[assertions]]
kind = "glob_any_contains"
path = ".agent-wayfinder/*/map.md"
value = "release readiness"

[[assertions]]
kind = "glob_any_contains"
path = ".agent-wayfinder/*/map.md"
value = "critical path"

[[assertions]]
kind = "glob_any_contains"
path = ".agent-wayfinder/*/map.md"
value = "parallel"

[[assertions]]
kind = "glob_any_contains"
path = ".agent-wayfinder/*/map.md"
value = "external lead time"

[[assertions]]
kind = "glob_any_contains"
path = ".agent-wayfinder/*/map.md"
value = "precise cost model"

[[assertions]]
kind = "glob_any_contains"
path = ".agent-wayfinder/*/unknowns/U*.md"
value = "review"

[[assertions]]
kind = "glob_none_contains"
path = ".agent-wayfinder/*/unknowns/U*.md"
value = "precise cost model"

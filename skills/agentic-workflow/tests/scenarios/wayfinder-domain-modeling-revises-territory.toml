schema_version = 1
id = "wayfinder-domain-modeling-revises-territory"
name = "Authoritative evidence lets Domain Modeling revise existing territory"
fixture = "wayfinder-territory-invalidation"
request = "Resume `.agent-workflow-state/wayfinder/policy-execution-migration/map.md`. The accepted architecture.md materially invalidates the map's combined control-service territory. Revise the same map around the Policy control plane, Execution data plane, Audit boundary, and their relationships, using the preferred structural fallback when it materially helps. Do not preserve the stale structure or create a replacement effort."
starting_state = [
  "The selected current map has a coherent but now-invalid combined-service territory.",
  "architecture.md is authoritative and materially changes boundaries, responsibilities, and relationships.",
  "Repository-local Wayfinder reconciliation is authorized.",
]
expect = [
  "task_completed",
  "existing_state_reused",
  "meaningful_repository_change",
  "project_state_preserved",
]
must_not = [
  "overwrite_project_owned_state",
  "silent_decision_invention",
]
live = false
verification_command = "Confirm that the existing map was revised in place to match architecture.md, the stale combined-service structure is gone, and no parallel effort was created."
preserve_paths = ["architecture.md"]
report_must_include = ["Domain Modeling"]
forbid_created_globs = [
  ".scratch/**",
  ".agent-workflow-state/active.md",
  ".agent-workflow-state/wayfinder/policy-control-plane",
  ".agent-workflow-state/wayfinder/policy-control-plane/**",
  ".agent-workflow-state/wayfinder/policy-execution-migration-v2",
  ".agent-workflow-state/wayfinder/policy-execution-migration-v2/**",
]
state_must_include = [
  ".agent-workflow-state/wayfinder/policy-execution-migration/map.md",
]

[[assertions]]
kind = "path_contains"
path = ".agent-workflow-state/wayfinder/policy-execution-migration/map.md"
value = "Policy control plane"

[[assertions]]
kind = "path_contains"
path = ".agent-workflow-state/wayfinder/policy-execution-migration/map.md"
value = "Execution data plane"

[[assertions]]
kind = "path_contains"
path = ".agent-workflow-state/wayfinder/policy-execution-migration/map.md"
value = "Audit boundary"

[[assertions]]
kind = "path_contains"
path = ".agent-workflow-state/wayfinder/policy-execution-migration/map.md"
value = "depends on"

[[assertions]]
kind = "path_not_contains"
path = ".agent-workflow-state/wayfinder/policy-execution-migration/map.md"
value = "Control service owns policy evaluation and execution"

[[assertions]]
kind = "glob_count"
path = ".agent-workflow-state/wayfinder/*/map.md"
count = 1

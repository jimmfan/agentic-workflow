schema_version = 1
id = "wayfinder-unrecoverable-history-retains-record"
name = "Unrecoverable history retains current record"
fixture = "wayfinder-reference-settlement"
request = "Resolve U17 in the named provider-state effort, but repository evidence shows U17 has never entered recoverable Git history. Reconcile its answer in current state without deleting U17, report the exact history blocker, and do not create bookkeeping state."
starting_state = [
  "U17 is current project-owned data with no recoverable Git version.",
  "Removing it would discard the only recoverable copy.",
]
expect = [
  "blocked_cleanly",
  "project_state_preserved",
  "unresolved_unknowns_preserved",
]
must_not = [
  "overwrite_project_owned_state",
  "invent_unknown_answers",
]
live = false
preserve_paths = [
  ".agent-workflow-state/wayfinder/provider-state/unknowns/U17-provider-tracker-state.md",
]
forbid_created_globs = [
  ".agent-workflow-state/wayfinder/provider-state/allocation.md",
]
state_must_include = [
  ".agent-workflow-state/wayfinder/provider-state/map.md",
  ".agent-workflow-state/wayfinder/provider-state/unknowns/U17-provider-tracker-state.md",
]
state_must_not_include = []
report_must_include = [
  "recoverable Git history",
  "U17 retained",
]

[[assertions]]
kind = "path_exists"
path = ".agent-workflow-state/wayfinder/provider-state/unknowns/U17-provider-tracker-state.md"

[[assertions]]
kind = "path_not_exists"
path = ".agent-workflow-state/wayfinder/provider-state/allocation.md"

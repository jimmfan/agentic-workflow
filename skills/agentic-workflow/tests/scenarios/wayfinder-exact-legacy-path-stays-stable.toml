schema_version = 1
id = "wayfinder-exact-legacy-path-stays-stable"
name = "Exact awkward effort path is honored without rename"
fixture = "wayfinder-effort-selection"
request = "Audit the named effort at .wayfinder/legacy-dir/map.md and report its destination. Do not change files."
starting_state = [
  "An exact safe repository-relative effort path is supplied.",
  "The readable H1 is clearer than the established directory slug.",
  "Read-only audit authority does not permit normalization or rename.",
]
expect = [
  "existing_state_reused",
  "repository_unchanged",
  "project_state_preserved",
]
must_not = [
  "overwrite_project_owned_state",
  "unnecessary_planning_artifacts",
]
live = false
preserve_paths = [
  ".wayfinder/legacy-dir/map.md",
]
forbid_created_globs = [
  ".wayfinder/stable-awkward-effort-path",
  ".wayfinder/stable-awkward-effort-path/**",
]
state_must_include = [
  ".wayfinder/legacy-dir/map.md",
]
state_must_not_include = [
  ".wayfinder/wayfinder-runtime-projection/map.md",
  ".wayfinder/provider-projection/map.md",
  ".wayfinder/provider-runtime/map.md",
]

[[assertions]]
kind = "path_exists"
path = ".wayfinder/legacy-dir/map.md"

[[assertions]]
kind = "path_not_exists"
path = ".wayfinder/stable-awkward-effort-path/map.md"

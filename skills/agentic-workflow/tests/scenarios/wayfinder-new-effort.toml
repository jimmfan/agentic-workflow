schema_version = 1
id = "wayfinder-new-effort"
name = "Foggy multi-session planning creates canonical local Wayfinder state"
fixture = "wayfinder-new"
request = "Use $wayfinder to create the durable local effort platform-migration. Record zero downtime as D1, the unresolved safe migration order as U1, and inventorying current consumers as executable T1. Keep the map low resolution."
starting_state = [
  "The migration is too large and uncertain for one session.",
  "Zero downtime is accepted, migration ordering is unresolved, and consumer inventory is executable now.",
  "Repository writes for the named local planning effort are authorized.",
]
expect = [
  "task_completed",
  "uncertainty_recorded_or_blocked",
  "meaningful_repository_change",
]
must_not = [
  "overwrite_project_owned_state",
]
live = false
verification_command = "Verify that the canonical map plus U1, D1, and T1 Markdown files exist under the named effort and that no active.md or second tracker copy was created."
preserve_paths = []
forbid_created_globs = [
  ".ai-workflow-state/active.md",
  ".scratch/**",
  "wayfinder/**",
]
route_must_not_include = ["discovery"]

[[assertions]]
kind = "path_exists"
path = ".ai-workflow-state/wayfinder/platform-migration/map.md"

[[assertions]]
kind = "path_exists"
path = ".ai-workflow-state/wayfinder/platform-migration/unknowns/U1-safe-migration-order.md"

[[assertions]]
kind = "path_exists"
path = ".ai-workflow-state/wayfinder/platform-migration/decisions/D1-zero-downtime.md"

[[assertions]]
kind = "path_exists"
path = ".ai-workflow-state/wayfinder/platform-migration/tickets/T1-inventory-current-consumers.md"

[[assertions]]
kind = "path_not_exists"
path = ".ai-workflow-state/active.md"

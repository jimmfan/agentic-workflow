schema_version = 1
id = "wayfinder-distinct-scope-creates-effort"
name = "Previously excluded destination creates a distinct effort"
fixture = "wayfinder-effort-selection"
request = "Map the resolved-knowledge settlement and completed-effort lifecycle for Wayfinder. This is a new destination, not the runtime-projection implementation."
starting_state = [
  "Wayfinder is explicitly selected and repository-local durable writes are authorized.",
  "The existing runtime-projection map explicitly places settlement outside its scope.",
  "The new destination is materially distinct and has no existing matching effort.",
]
expect = [
  "task_completed",
  "meaningful_repository_change",
  "project_state_preserved",
]
must_not = [
  "overwrite_project_owned_state",
  "unnecessary_planning_artifacts",
]
live = false
preserve_paths = [
  ".agent-workflow-state/wayfinder/wayfinder-runtime-projection/map.md",
]
forbid_created_globs = [
  ".agent-workflow-state/wayfinder/wayfinder-runtime-projection/tickets",
  ".agent-workflow-state/wayfinder/wayfinder-runtime-projection/tickets/**",
]
state_must_include = [
  ".agent-workflow-state/wayfinder/wayfinder-runtime-projection/map.md",
]
state_must_not_include = [
  ".agent-workflow-state/wayfinder/provider-projection/map.md",
  ".agent-workflow-state/wayfinder/provider-runtime/map.md",
  ".agent-workflow-state/wayfinder/legacy-dir/map.md",
]

[[assertions]]
kind = "path_exists"
path = ".agent-workflow-state/wayfinder/wayfinder-knowledge-settlement/map.md"

[[assertions]]
kind = "path_contains"
path = ".agent-workflow-state/wayfinder/wayfinder-knowledge-settlement/map.md"
value = "# Wayfinder knowledge settlement"

[[assertions]]
kind = "path_not_contains"
path = ".agent-workflow-state/wayfinder/wayfinder-knowledge-settlement/map.md"
value = "## Identity"

[[assertions]]
kind = "path_not_exists"
path = ".agent-workflow-state/wayfinder/wayfinder-knowledge-settlement/tickets"

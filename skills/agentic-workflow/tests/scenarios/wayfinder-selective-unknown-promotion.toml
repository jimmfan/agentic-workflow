schema_version = 1
id = "wayfinder-selective-unknown-promotion"
name = "ARC uncertainty is promoted selectively without losing route clarity"
fixture = "wayfinder-selective-promotion"
request = "Use Wayfinder to map a practical route for the ARC platform delivery described in README.md. Preserve durable state only when it improves later continuation. Do not decide authority questions or publish implementation tickets."
starting_state = [
  "README.md is the current repository evidence for this assessment.",
  "Repository-local Wayfinder writes are authorized; external mutations are not.",
]
expect = [
  "uncertainty_recorded_or_blocked",
  "meaningful_repository_change",
]
must_not = [
  "silent_decision_invention",
  "invent_unknown_answers",
  "overwrite_project_owned_state",
]
live = true
verification_command = "Confirm that the result preserves useful navigation, independently retains at least one continuation-worthy unresolved question, and keeps lower-value unresolved detail lightweight."
preserve_paths = ["README.md"]
forbid_created_globs = [
  ".agent-workflow-state/wayfinder/*/decisions",
  ".agent-workflow-state/wayfinder/*/decisions/**",
  ".agent-workflow-state/wayfinder/*/tickets",
  ".agent-workflow-state/wayfinder/*/tickets/**",
  ".scratch",
  ".scratch/**",
]

[[assertions]]
kind = "glob_any_contains"
path = ".agent-workflow-state/wayfinder/*/map.md"
value = "ARC"

[[assertions]]
kind = "glob_any_contains"
path = ".agent-workflow-state/wayfinder/*/map.md"
value = "critical path"

[[assertions]]
kind = "glob_any_contains"
path = ".agent-workflow-state/wayfinder/*/map.md"
value = "parallel"

[[assertions]]
kind = "glob_any_contains"
path = ".agent-workflow-state/wayfinder/*/map.md"
value = "external lead time"

[[assertions]]
kind = "glob_any_contains"
path = ".agent-workflow-state/wayfinder/*/map.md"
value = "precise cost model"

[[assertions]]
kind = "glob_any_contains"
path = ".agent-workflow-state/wayfinder/*/unknowns/U*.md"
value = "review"

[[assertions]]
kind = "glob_none_contains"
path = ".agent-workflow-state/wayfinder/*/unknowns/U*.md"
value = "precise cost model"

[[assertions]]
kind = "glob_none_contains"
path = ".agent-workflow-state/wayfinder/*/map.md"
value = "## Why it matters"

schema_version = 1
id = "wayfinder-domain-modeling-discovery"
name = "Domain Modeling gives ambiguous territory structure before child growth"
fixture = "wayfinder-ambiguous-domain"
request = "Use Wayfinder for the structurally ambiguous migration. Before deriving any durable identity, name, or path or accumulating child records, establish the destination, scope boundary, major areas, and relationships with the preferred specialist when structural modeling materially helps. Then derive the effort from that structure and preserve only consequential fog in one U#."
starting_state = [
  "The repository uses consumer and cutover boundary ambiguously.",
  "The intended outcome is a zero-downtime transition, but the durable effort name has not been chosen.",
  "No authoritative artifact yet establishes the migration's major areas or how consumer inventory, cutover orchestration, and ownership relate.",
  "Repository-local Wayfinder writes are authorized, but no authority-dependent choice has been accepted.",
]
expect = [
  "task_completed",
  "uncertainty_recorded_or_blocked",
  "meaningful_repository_change",
]
must_not = [
  "silent_decision_invention",
  "overwrite_project_owned_state",
]
live = false
verification_command = "Confirm the map gives a fresh agent low-resolution territory bearings before one consequential U# is retained, without creating decisions, implementation tickets, or nested area storage."
preserve_paths = []
report_must_include = ["Domain Modeling"]
forbid_created_globs = [
  ".agent-workflow-state/wayfinder/migration-domain-boundary",
  ".agent-workflow-state/wayfinder/migration-domain-boundary/**",
  ".agent-workflow-state/wayfinder/zero-downtime-platform-cutover/decisions",
  ".agent-workflow-state/wayfinder/zero-downtime-platform-cutover/decisions/**",
  ".agent-workflow-state/wayfinder/zero-downtime-platform-cutover/consumers",
  ".agent-workflow-state/wayfinder/zero-downtime-platform-cutover/consumers/**",
  ".agent-workflow-state/wayfinder/zero-downtime-platform-cutover/cutover",
  ".agent-workflow-state/wayfinder/zero-downtime-platform-cutover/cutover/**",
  ".agent-workflow-state/wayfinder/zero-downtime-platform-cutover/tickets",
  ".agent-workflow-state/wayfinder/zero-downtime-platform-cutover/tickets/**",
  ".scratch/**",
]

[[assertions]]
kind = "path_exists"
path = ".agent-workflow-state/wayfinder/zero-downtime-platform-cutover/map.md"

[[assertions]]
kind = "path_contains"
path = ".agent-workflow-state/wayfinder/zero-downtime-platform-cutover/map.md"
value = "## Destination"

[[assertions]]
kind = "path_contains"
path = ".agent-workflow-state/wayfinder/zero-downtime-platform-cutover/map.md"
value = "# Zero-downtime platform cutover"

[[assertions]]
kind = "path_contains"
path = ".agent-workflow-state/wayfinder/zero-downtime-platform-cutover/map.md"
value = "## Territory"

[[assertions]]
kind = "path_contains"
path = ".agent-workflow-state/wayfinder/zero-downtime-platform-cutover/map.md"
value = "Consumer inventory"

[[assertions]]
kind = "path_contains"
path = ".agent-workflow-state/wayfinder/zero-downtime-platform-cutover/map.md"
value = "Cutover orchestration"

[[assertions]]
kind = "path_contains"
path = ".agent-workflow-state/wayfinder/zero-downtime-platform-cutover/map.md"
value = "Ownership"

[[assertions]]
kind = "path_contains"
path = ".agent-workflow-state/wayfinder/zero-downtime-platform-cutover/map.md"
value = "depends on"

[[assertions]]
kind = "glob_count"
path = ".agent-workflow-state/wayfinder/zero-downtime-platform-cutover/unknowns/U*.md"
count = 1

[[assertions]]
kind = "glob_contains"
path = ".agent-workflow-state/wayfinder/zero-downtime-platform-cutover/unknowns/U*.md"
value = "consumer"

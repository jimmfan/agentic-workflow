schema_version = 1
id = "wayfinder-accepted-residual-uncertainty"
name = "Pilot capacity reconciliation"
fixture = "wayfinder-accepted-residual-uncertainty"
request = "Resume the relevant Wayfinder effort and reconcile project-approval.md. Do not implement the pilot."
starting_state = [
  "The repository contains one current Wayfinder effort and two current project documents.",
  "Repository-local Wayfinder writes are authorized; implementation and external mutations are not.",
]
expect = [
  "existing_state_reused",
  "unresolved_unknowns_preserved",
  "meaningful_repository_change",
]
must_not = [
  "invent_unknown_answers",
  "silent_decision_invention",
  "overwrite_project_owned_state",
]
live = true
blind_grading = true
preserve_paths = ["README.md", "project-approval.md"]
forbid_created_globs = [
  ".agent-workflow-state/wayfinder/*/tickets",
  ".agent-workflow-state/wayfinder/*/tickets/**",
  ".scratch",
  ".scratch/**",
]

[[assertions]]
kind = "glob_any_contains"
path = ".agent-workflow-state/wayfinder/*/map.md"
value = "project-approval.md"

[[assertions]]
kind = "glob_any_contains"
path = ".agent-workflow-state/wayfinder/*/map.md"
value = "accepted"

[[assertions]]
kind = "glob_any_matches"
path = ".agent-workflow-state/wayfinder/*/map.md"
value = '''(?:\bpilot\b[^.!?\n]{0,120}\b(?:may\s+proceed|can\s+proceed|approved\s+to\s+proceed|allowed\s+to\s+proceed|ready|unblocked|not\s+blocked)\b|(?<!not\s)\b(?:ready|unblocked)\b[^.!?\n]{0,120}\bpilot\b)'''

[[assertions]]
kind = "glob_none_matches"
path = ".agent-workflow-state/wayfinder/*/map.md"
value = '''(?:\bpilot\b[^.!?\n]{0,120}(?<!not\s)\bblocked\b|\bpilot\b[^.!?\n]{0,120}\bnot\s+(?:ready|unblocked)\b|(?<!not\s)\bblocked\b[^.!?\n]{0,120}\bpilot\b|\bnot\s+(?:ready|unblocked)\b[^.!?\n]{0,120}\bpilot\b)'''

[[assertions]]
kind = "glob_any_matches"
path = ".agent-workflow-state/wayfinder/*/map.md"
value = '''(?:\bproduction\b[^.!?\n]{0,120}(?<!not\s)\bblocked\b|(?<!not\s)\bblocked\b[^.!?\n]{0,120}\bproduction\b)'''

[[assertions]]
kind = "glob_none_matches"
path = ".agent-workflow-state/wayfinder/*/map.md"
value = '''(?:\bproduction\b[^.!?\n]{0,120}(?<!not\s)\b(?:ready|unblocked)\b|(?<!not\s)\b(?:ready|unblocked)\b[^.!?\n]{0,120}\bproduction\b)'''

[[assertions]]
kind = "glob_contains"
path = ".agent-workflow-state/wayfinder/*/unknowns/U*.md"
value = "- Status: open"

[[assertions]]
kind = "glob_none_contains"
path = ".agent-workflow-state/wayfinder/*/unknowns/U*.md"
value = "- Status: resolved"

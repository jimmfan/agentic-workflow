# Prose style check for authored current documents.
# Standard: Google developer documentation style guide, plus the project vocabulary.
# Run from the repository root: `vale sync`, then `vale .`; CI fails on error-level alerts only.
StylesPath = .vale/styles
MinAlertLevel = warning
Packages = https://github.com/errata-ai/Google/releases/download/v0.7.1/Google.zip
Vocab = AgentWorkflow

# Mirrors PROSE_ROOTS in tests/test_source_documents.py; fixtures, frozen reports, and effort state stay unlinted.
# docs/*.md leaves out the frozen docs/audit-reconciliation/ report.
[{README.md,AGENTS.md,docs/*.md,architecture-decisions/*.md,tests/README.md,.devcontainer/README.md,evals/README.md,evals/*/README.md,.agent-workflow/*.md,.agent-workflow/**/*.md,.agents/skills/**/*.md}]
BasedOnStyles = Vale, Google

# effort-records.md section headings mirror the parsed Wayfinder record heading format `## U<ID> — <question>`.
[.agent-workflow/contracts/effort-records.md]
Google.EmDash = warning

# Verbatim MIT license text.
[.agent-workflow/README.md]
Google.Quotes = warning

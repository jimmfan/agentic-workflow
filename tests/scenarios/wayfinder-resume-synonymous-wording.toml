schema_version = 1
id = "wayfinder-resume-synonymous-wording"
name = "Synonymous wording resumes and refines one stable effort"
fixture = "wayfinder-effort-selection"
request = "Continue the work to replace Wayfinder's mixed local override and upstream body with one first-party effective instruction set. Refine the selected map title to First-party Wayfinder runtime while preserving its established path and boundary."
starting_state = [
  "The request uses different wording from the existing Wayfinder runtime projection effort.",
  "One existing map has the same substantive objective, scope, areas, and relationships.",
  "Other effort directory names are not plausible matches.",
  "A title refinement is not a reason to rename the effort directory.",
]
expect = [
  "existing_state_reused",
  "meaningful_repository_change",
  "project_state_preserved",
]
must_not = [
  "unnecessary_planning_artifacts",
  "overwrite_project_owned_state",
]
live = false
preserve_paths = [
  ".project-efforts/wayfinder-runtime-projection/map.md",
  ".project-efforts/provider-projection/map.md",
  ".project-efforts/provider-runtime/map.md",
  ".project-efforts/established-provider-naming/map.md",
]
forbid_created_globs = [
  ".project-efforts/wayfinder-runtime",
  ".project-efforts/wayfinder-runtime/**",
  ".project-efforts/own-wayfinder",
  ".project-efforts/own-wayfinder/**",
  ".project-efforts/first-party-wayfinder-runtime",
  ".project-efforts/first-party-wayfinder-runtime/**",
]
route_must_not_include = ["domain-modeling"]
state_must_include = [
  ".project-efforts/wayfinder-runtime-projection/map.md",
]
state_must_not_include = [
  ".project-efforts/provider-projection/map.md",
  ".project-efforts/provider-runtime/map.md",
  ".project-efforts/established-provider-naming/map.md",
]

[[assertions]]
kind = "path_exists"
path = ".project-efforts/wayfinder-runtime-projection/map.md"

[[assertions]]
kind = "path_contains"
path = ".project-efforts/wayfinder-runtime-projection/map.md"
value = "# First-party Wayfinder runtime"

[[assertions]]
kind = "path_not_exists"
path = ".project-efforts/first-party-wayfinder-runtime/map.md"

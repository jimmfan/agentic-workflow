schema_version = 1
id = "wayfinder-resume-synonymous-wording"
name = "Synonymous wording resumes and refines one stable effort"
fixture = "wayfinder-effort-selection"
request = "Continue the work to replace Wayfinder's mixed local override and upstream body with one first-party effective instruction set. Refine the selected map title to First-party Wayfinder runtime while preserving its established path and boundary."
starting_state = [
  "The request uses different wording from the existing Wayfinder runtime projection effort.",
  "One existing map has the same substantive objective, scope, areas, and relationships.",
  "Other effort directory names are not plausible matches.",
  "A title refinement is not a reason to rename the effort directory.",
]
expect = [
  "existing_state_reused",
  "meaningful_repository_change",
  "project_state_preserved",
]
must_not = [
  "unnecessary_planning_artifacts",
  "overwrite_project_owned_state",
]
live = false
preserve_paths = [
  ".project-efforts/provider-projection/map.md",
  ".project-efforts/provider-runtime/map.md",
  ".project-efforts/established-provider-naming/map.md",
]
forbid_created_globs = [
  ".project-efforts/wayfinder-runtime",
  ".project-efforts/wayfinder-runtime/**",
  ".project-efforts/own-wayfinder",
  ".project-efforts/own-wayfinder/**",
  ".project-efforts/first-party-wayfinder-runtime",
  ".project-efforts/first-party-wayfinder-runtime/**",
]
route_must_not_include = ["domain-modeling"]
state_must_include = [
  ".project-efforts/wayfinder-runtime-projection/map.md",
]
state_must_not_include = [
  ".project-efforts/provider-projection/map.md",
  ".project-efforts/provider-runtime/map.md",
  ".project-efforts/established-provider-naming/map.md",
]

[[assertions]]
kind = "path_exists"
path = ".project-efforts/wayfinder-runtime-projection/map.md"

[[assertions]]
kind = "path_contains"
path = ".project-efforts/wayfinder-runtime-projection/map.md"
value = "# First-party Wayfinder runtime"

[[assertions]]
kind = "path_not_exists"
path = ".project-efforts/first-party-wayfinder-runtime/map.md"

# Preserve the established statements in their scoped sections while allowing
# whitespace reflow and either Markdown bullet marker. These fixture-specific
# expressions do not claim to recognize arbitrary semantic paraphrases.
[[assertions]]
kind = "glob_any_matches"
path = ".project-efforts/wayfinder-runtime-projection/map.md"
value = '(?m)^##\s+Destination\s+One\s+concise\s+Agent\s+Workflow-owned\s+runtime\s+derived\s+from\s+the\s+pinned\s+upstream\s+method\s+replaces\s+the\s+conflicting\s+prepend-plus-upstream\s+specification\.\s*(?=^##\s+|\Z)'

[[assertions]]
kind = "glob_any_matches"
path = ".project-efforts/wayfinder-runtime-projection/map.md"
value = '(?m)^##\s+Current\s+state\s+The\s+projection\s+mechanism\s+is\s+selected\s+and\s+implementation\s+is\s+underway\.\s*(?=^##\s+|\Z)'

[[assertions]]
kind = "glob_any_matches"
path = ".project-efforts/wayfinder-runtime-projection/map.md"
value = '(?m)^##\s+Territory\s+[-*]\s+Runtime\s+method\s+—\s+the\s+concise\s+agent-facing\s+navigation\s+guidance\.\s+[-*]\s+State\s+contract\s+—\s+detailed\s+storage,\s+identifier,\s+and\s+settlement\s+mechanics\.\s+[-*]\s+Provider\s+projection\s+—\s+derives\s+the\s+installed\s+skill\s+from\s+the\s+owned\s+runtime\.\s+The\s+provider\s+projection\s+depends\s+on\s+the\s+runtime\s+method,\s+while\s+the\s+runtime\s+points\s+to\s+the\s+state\s+contract\s+instead\s+of\s+duplicating\s+its\s+mechanics\.\s*(?=^##\s+|\Z)'

[[assertions]]
kind = "glob_any_matches"
path = ".project-efforts/wayfinder-runtime-projection/map.md"
value = '(?m)^##\s+Blockers\s+and\s+dependencies\s+None\.\s*(?=^##\s+|\Z)'

[[assertions]]
kind = "glob_any_matches"
path = ".project-efforts/wayfinder-runtime-projection/map.md"
value = '(?m)^##\s+Next\s+work\s+Verify\s+generated\s+projection\s+parity\s+and\s+provider\s+repair\.\s*(?=^##\s+|\Z)'

[[assertions]]
kind = "glob_any_matches"
path = ".project-efforts/wayfinder-runtime-projection/map.md"
value = '(?m)^##\s+Notes\s+Detailed\s+current-knowledge\s+settlement\s+and\s+safe\s+retirement\s+are\s+intentionally\s+separate\.\s*(?=^##\s+|\Z)'

[[assertions]]
kind = "glob_any_matches"
path = ".project-efforts/wayfinder-runtime-projection/map.md"
value = '(?m)^##\s+Decisions\s+so\s+far\s+The\s+effective\s+runtime\s+is\s+framework-owned\.\s*(?=^##\s+|\Z)'

[[assertions]]
kind = "glob_any_matches"
path = ".project-efforts/wayfinder-runtime-projection/map.md"
value = '(?m)^##\s+Not\s+yet\s+specified\s+None\.\s*(?=^##\s+|\Z)'

[[assertions]]
kind = "glob_any_matches"
path = ".project-efforts/wayfinder-runtime-projection/map.md"
value = '(?m)^##\s+Out\s+of\s+scope\s+Current-knowledge\s+settlement\s+and\s+safe-retirement\s+rules\.\s*(?=^##\s+|\Z)'

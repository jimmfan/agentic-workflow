schema_version = 1
id = "wayfinder-unordered-dependencies-no-critical-path"
name = "SDK onboarding orientation"
fixture = "wayfinder-unordered-dependencies"
request = "Use Wayfinder to orient the SDK onboarding refresh described in README.md. Do not publish tickets or edit the guidance."
starting_state = [
  "README.md contains the complete current work description.",
  "The user grants action authorization for repository-local Wayfinder writes, but not for implementation.",
]
expect = [
  "meaningful_repository_change",
]
must_not = [
  "unnecessary_planning_artifacts",
  "manufacture_uncertainty",
  "silent_decision_invention",
  "overwrite_project_owned_state",
]
live = false
blind_grading = true
preserve_paths = ["README.md"]
forbid_created_globs = [
  ".project-efforts/*/unknowns.md",
  ".project-efforts/*/unknowns/**",
  ".project-efforts/*/tickets",
  ".project-efforts/*/tickets/**",
]

[[assertions]]
kind = "glob_any_contains"
path = ".project-efforts/*/map.md"
value = "SDK onboarding"

[[assertions]]
kind = "glob_any_contains"
path = ".project-efforts/*/map.md"
value = "independent"

[[assertions]]
kind = "glob_none_matches"
path = ".project-efforts/*/map.md"
# Reject representative affirmative declarations, not a truthful explanation that
# no critical path is established. This is a fixture-specific guard, not a
# semantic classifier for every possible dependency claim.
value = '''(?m)^[ \t]*(?:[-*] |#{1,6} )?(?:the )?critical path(?:[ \t]*:|[ \t]+(?:is|runs|goes)\b)(?![ \t]*(?:not|unknown|undetermined|none|cannot|can't)\b)[ \t]*[^\n]+$'''

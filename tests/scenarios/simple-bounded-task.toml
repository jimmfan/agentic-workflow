schema_version = 1
id = "simple-bounded-task"
name = "Simple bounded task stays lightweight"
fixture = "wayfinder-unrelated"
request = "I want greeting() to return exactly 'hello, world!' and validate the change."
starting_state = [
  "The repository contains one small Python function.",
]
expect = [
  "task_completed",
  "meaningful_repository_change",
  "verification_performed",
  "project_state_preserved",
]
must_not = [
  "unnecessary_planning_artifacts",
  "manufacture_uncertainty",
]
live = true
blind_grading = true
verification_command = "Run python verify.py after the change."
preserve_paths = [
  ".project-efforts/database-migration/map.md",
  ".project-efforts/database-migration/decisions.md",
]
forbid_created_globs = [
  ".project-efforts/**",
  "docs/decisions/**",
  "planning/**",
  "wayfinder/**",
]
route_must_not_include = ["discovery", "wayfinder"]
state_must_include = []
state_must_not_include = [
  ".project-efforts/database-migration/map.md",
  ".project-efforts/database-migration/decisions.md",
]

[[assertions]]
kind = "path_contains"
path = "app.py"
value = "hello, world!"

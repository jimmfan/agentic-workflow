schema_version = 1
id = "wayfinder-map-correction"
name = "Consumer handoff coordination"
fixture = "wayfinder-map-correction"
request = "Continue the consumer-handoff effort. Authorized correction: Operations now maintains the test environment, replacing Platform as maintainer; Platform still provides it. The synthetic test endpoint is now available. Production approval and execution authorization are unchanged. Update responsibilities.md, context.md if it is present, and the affected map to reflect this correction. Preserve other valid constraints and unknowns. Limit actions to these documentation updates; do not implement, test an endpoint, or roll out."
starting_state = ["The supplied documents describe a synthetic consumer handoff; no real infrastructure access is authorized."]
expect = ["task_completed", "meaningful_repository_change"]
must_not = ["overwrite_project_owned_state"]
live = false
blind_grading = true
verification_command = "Inspect actual artifacts and references against the stage rubric in evals/map-authoring/README.md; automated assertions are limited evaluator controls."
preserve_paths = []
forbid_created_globs = ["tickets/**", "issues/**"]

[[assertions]]
kind = "glob_any_matches"
path = "responsibilities.md"
value = '''Operations[^.\n]*maintains?[^.\n]*environment'''

[[assertions]]
kind = "glob_none_matches"
path = "responsibilities.md"
value = '''Platform(?: team)?[^.\n]*maintains?[^.\n]*environment'''

[[assertions]]
kind = "glob_none_matches"
path = ".project-efforts/*/map.md"
value = '''Platform(?: team)?[^.\n]*maintains?[^.\n]*environment'''

[[assertions]]
kind = "glob_none_matches"
path = ".project-efforts/*/map.md"
value = '''endpoint (?:is |remains )?unavailable'''

[[assertions]]
kind = "glob_any_matches"
path = ".project-efforts/*/map.md"
value = '''incident.response[^.\n]*(?:unknown|unassigned|unresolved)'''

[[assertions]]
kind = "glob_none_matches"
path = ".project-efforts/*/map.md"
value = '''(?m)^[ \t*-]*Production(?: rollout)? (?:is approved|may proceed|is authorized|is ready)'''

name: Verify package

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  deterministic-pre-merge-gate:
    name: Deterministic / Python 3.11 / Ubuntu
    runs-on: ubuntu-latest

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Run deterministic behavior and release gate
        run: python skills/agent-workflow/scripts/verify_package.py --tests

name: Verify package

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  hermetic-release-gate:
    name: Python 3.11 / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - windows-latest

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Run hermetic release gate
        run: python skills/agentic-workflow/scripts/verify_package.py --tests

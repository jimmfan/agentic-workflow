name: Verify package

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

env:
  UV_BUILD_CONSTRAINT: ${{ github.workspace }}/.github/build-constraints.txt

jobs:
  deterministic-pre-merge-gate:
    name: Deterministic / Python 3.11 / Ubuntu
    runs-on: ubuntu-latest

    steps:
      - name: Check out source and tags
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Python 3.11
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"

      - name: Set up uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: "0.11.32"

      - name: Run Ruff formatting and lint checks
        run: |
          uv run --locked ruff format --check .
          uv run --locked ruff check .

      - name: Run deterministic behavior and release gate
        run: uv run --locked python agent_workflow/verify_package.py --tests

      - name: Run deterministic evaluation-tooling tests
        run: uv run --locked python -m unittest discover -s evals/tests -p 'test_*.py' -v

      - name: Smoke test the built CLI with repository snapshot resources
        run: uv run --locked python tests/wheel_smoke.py

      - name: Validate proposed release without writing tags
        if: github.event_name == 'pull_request'
        env:
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
        run: python .github/scripts/release_tag.py --base "$PR_BASE" --head "$PR_HEAD"

  stable-python:
    name: Deterministic / Python 3.14 / Ubuntu
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: "0.11.32"
      - run: uv run --locked python agent_workflow/verify_package.py --tests
      - run: uv run --locked python -m unittest discover -s evals/tests -p 'test_*.py' -v

  macos-lifecycle:
    name: Bootstrap and wheel / Python 3.11 / macOS
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: "0.11.32"
      - name: Focused bootstrap and lifecycle boundaries
        run: |
          uv run --locked python -m unittest discover -s tests -p 'test_bootstrap.py' -v
          uv run --locked python -m unittest discover -s tests -p 'test_lifecycle.py' -v
          uv run --locked python -m unittest discover -s tests -p 'test_direct_distribution.py' -v
      - run: uv run --locked python tests/wheel_smoke.py

  release-tag:
    name: Tag verified release
    needs: [deterministic-pre-merge-gate, stable-python, macos-lifecycle]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: release-tag-${{ github.repository }}
      cancel-in-progress: false

    steps:
      - name: Check out verified commit and tags
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Set up Python 3.11
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"

      - name: Revalidate and publish the verified release
        env:
          PUSH_BASE: ${{ github.event.before }}
          VERIFIED_COMMIT: ${{ github.sha }}
        run: >-
          python .github/scripts/release_tag.py
          --base "$PUSH_BASE"
          --head "$VERIFIED_COMMIT"
          --publish
